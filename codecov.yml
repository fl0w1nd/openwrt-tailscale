# Codecov configuration for openwrt-tailscale.
# Reference: https://docs.codecov.com/docs/codecov-yaml

codecov:
  require_ci_to_pass: true
  notify:
    # Wait for the `coverage` job to upload before posting comments.
    after_n_builds: 1

coverage:
  precision: 1
  round: down
  range: "60...90"
  status:
    # Project-level coverage gate: don't regress overall coverage by
    # more than 1% versus the base branch.
    project:
      default:
        target: auto
        threshold: 1%
        informational: false
        only_pulls: false
    # Patch-level coverage gate: new / changed lines should be 80% covered.
    # Set `informational: true` while the codebase is still being instrumented;
    # flip to false once function-level bats coverage stabilises.
    patch:
      default:
        target: 80%
        threshold: 5%
        informational: true
        only_pulls: true

flags:
  shell:
    # Excludes test scaffolding from the coverage denominator.
    paths:
      - tailscale-manager.sh
      - usr/lib/tailscale/
      - etc/init.d/
      - usr/bin/
    carryforward: true

ignore:
  - "tests/"
  - "docs/"
  - "build/"
  - "dist/"
  - "scripts/build-small.sh"
  - "luci-app-tailscale/"

comment:
  layout: "header, diff, files, footer"
  behavior: default
  require_changes: true
  require_base: false
  require_head: true
