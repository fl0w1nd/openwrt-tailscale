name: Bug report
description: Report a reproducible problem on OpenWrt.
labels: ["bug", "triage"]
body:
  - type: markdown
    attributes:
      value: |
        Before opening a bug report, update the manager and collect a masked diagnostic report:

        ```sh
        tailscale-manager self-update
        tailscale-manager diagnostics --maskinfo
        ```

        Add custom masks for router names, hostnames, or tailnet-specific labels:

        ```sh
        tailscale-manager diagnostics --maskinfo='my-router' --maskinfo='my-tailnet-label'
        ```

        For LuCI issues, also include:

        ```sh
        ubus call luci-tailscale get_install_info
        ubus call luci-tailscale get_status
        ```

  - type: checkboxes
    id: self-check
    attributes:
      label: Self-check
      options:
        - label: I searched existing issues and discussions.
          required: true
        - label: I read the relevant documentation section.
          required: true
        - label: I updated the manager with `tailscale-manager self-update`, or I explain the blocker below.
          required: true
        - label: I included `tailscale-manager diagnostics --maskinfo` output, or I explain the blocker below.
          required: true

  - type: dropdown
    id: area
    attributes:
      label: Affected area
      multiple: true
      options:
        - Installation / update
        - Service start / stop
        - LuCI app
        - Networking / subnet routing
        - Download source / version list
        - Logs / diagnostics
        - Documentation
        - Other
    validations:
      required: true

  - type: textarea
    id: summary
    attributes:
      label: Problem summary
      description: Describe the visible failure and where it appears.
      placeholder: "Example: LuCI status page shows the install screen while Tailscale is installed and running."
    validations:
      required: true

  - type: textarea
    id: reproduce
    attributes:
      label: Steps to reproduce
      description: Include exact commands, LuCI page paths, selected options, and timing.
      placeholder: |
        1. Run ...
        2. Open LuCI path ...
        3. Observe ...
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
      placeholder: "Describe the result you expected."
    validations:
      required: true

  - type: textarea
    id: diagnostics
    attributes:
      label: Diagnostics
      description: |
        Paste `tailscale-manager diagnostics --maskinfo` output here.
        For LuCI issues, also paste the two `ubus call luci-tailscale ...` outputs.
      render: shell
    validations:
      required: true

  - type: textarea
    id: extra
    attributes:
      label: Additional context
      description: Screenshots, topology notes, custom UCI settings, firewall changes, or reasons a self-check command failed.
    validations:
      required: false
