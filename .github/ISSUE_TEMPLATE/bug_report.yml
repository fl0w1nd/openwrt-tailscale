name: Bug report
description: Something is not working as expected on OpenWrt.
labels: ["bug", "triage"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for taking the time to file a bug report!
        Please go through the following sections — they help us reproduce the issue
        much faster, especially on uncommon devices and OpenWrt builds.

  - type: checkboxes
    id: prereq
    attributes:
      label: Prerequisites
      options:
        - label: I have searched existing issues and discussions.
          required: true
        - label: I have read the relevant section of the [documentation](https://fl0w1nd.github.io/openwrt-tailscale/).
          required: true
        - label: I am running the latest `tailscale-manager` (`tailscale-manager self-update`).
          required: false

  - type: input
    id: manager-version
    attributes:
      label: tailscale-manager version
      description: Output of `tailscale-manager --version` (or `head -50 /usr/bin/tailscale-manager | grep VERSION`).
      placeholder: "4.1.1"
    validations:
      required: true

  - type: input
    id: tailscale-version
    attributes:
      label: Installed Tailscale binary version
      description: Output of `tailscale version` (first line is enough).
      placeholder: "1.96.5"
    validations:
      required: true

  - type: dropdown
    id: source
    attributes:
      label: Download source
      options:
        - official
        - small
        - unknown
    validations:
      required: true

  - type: dropdown
    id: net-mode
    attributes:
      label: Networking mode
      options:
        - tun (kernel)
        - userspace
        - auto
        - unknown
    validations:
      required: true

  - type: input
    id: openwrt-release
    attributes:
      label: OpenWrt release / derivative
      description: Contents of `/etc/openwrt_release` (`DISTRIB_RELEASE`, `DISTRIB_TARGET`, `DISTRIB_ARCH`). Mention iStoreOS / ImmortalWrt if applicable.
      placeholder: |
        DISTRIB_RELEASE='23.05.5'
        DISTRIB_TARGET='ramips/mt7621'
        DISTRIB_ARCH='mipsel_24kc'
    validations:
      required: true

  - type: input
    id: device
    attributes:
      label: Device model
      placeholder: "Xiaomi AX3000 / Raspberry Pi 4 / x86_64 VM / ..."
    validations:
      required: true

  - type: textarea
    id: what-happened
    attributes:
      label: What happened?
      description: A clear description of the bug. Include exact commands run.
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: What did you expect to happen?
    validations:
      required: true

  - type: textarea
    id: logs
    attributes:
      label: Relevant logs / diagnostics
      description: |
        The fastest way to give us everything we need is one command:

        - `tailscale-manager diagnostics` — full report (versions, platform, install/runtime state, dependency checks, and recent logs). Paste the whole output.

        Or, if you only need the raw logs:

        - `tailscale-manager logs` — last 200 lines of the manager, service, and system logs at once
        - `logread -e tailscale | tail -200`
        - `tail -200 /var/log/tailscale-manager.log`
      render: shell
    validations:
      required: false

  - type: textarea
    id: extra
    attributes:
      label: Anything else?
      description: Screenshots, network topology, custom firewall rules, etc.
