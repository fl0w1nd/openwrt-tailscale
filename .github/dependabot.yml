version: 2
updates:
  # Keep all GitHub Actions pinned to commit SHAs and refresh them weekly.
  # Dependabot will update both the SHA and the trailing "# vN" comment.
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "03:00"
      timezone: Asia/Shanghai
    open-pull-requests-limit: 10
    commit-message:
      prefix: "ci"
      include: scope
    groups:
      gh-actions:
        patterns:
          - "*"

  # VitePress / pnpm dependencies for the docs site.
  - package-ecosystem: npm
    directory: /docs
    schedule:
      interval: weekly
      day: monday
      time: "03:00"
      timezone: Asia/Shanghai
    open-pull-requests-limit: 5
    commit-message:
      prefix: "docs"
      include: scope
    groups:
      docs-deps:
        patterns:
          - "*"
        update-types:
          - minor
          - patch
